    color: #222;
  }
  h1 { text-align: center; color: #1a5490; margin-bottom: 5px; }
  .subtitle { text-align: center; color: #666; margin-bottom: 25px; font-size: 14px; }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-bottom: 20px;
    padding: 15px;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }
  select, button {
    padding: 10px 16px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 14px;
    cursor: pointer;
    background: #fff;
  }
  button.primary {
    background: #1a5490;
    color: #fff;
    border: none;
    font-weight: bold;
  }
  button.primary:hover { background: #12406e; }

  .stats {
    text-align: center;
    color: #444;
    margin-bottom: 20px;
    font-size: 14px;
  }

  .question-card {
    background: #fff;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 18px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    border-left: 4px solid #1a5490;
  }
  .q-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 13px;
    color: #666;
  }
  .q-tag {
    background: #1a5490;
    color: #fff;
    padding: 2px 10px;
    border-radius: 4px;
    font-weight: bold;
    font-size: 12px;
  }
  .subject-tag {
    background: #e8f0fb;
    color: #1a5490;
    padding: 2px 10px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: bold;
  }
  textarea {
    width: 100%;
    min-height: 130px;
    padding: 12px;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 13px;
    line-height: 1.6;
    resize: vertical;
    background: #fafbfc;
  }
  .copy-btn {
    margin-top: 8px;
    background: #28a745;
    color: #fff;
    border: none;
    padding: 8px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    font-size: 13px;
  }
  .copy-btn:hover { background: #1f8437; }
  .copy-btn.copied { background: #6c757d; }

/* ============================================================
   RENDERING LOGIC (ise change karne ki zaroorat nahi)
   ============================================================ */

const subjectNames = {
  reasoning: "Reasoning",
  gk: "GK",
  math: "Mathematics",
  english: "English/Hindi"
};

const subjectColors = {
  reasoning: "#1a5490",
  gk: "#c0392b",
  math: "#27ae60",
  english: "#8e44ad"
};

function formatQuestion(q) {
  let text = `Q${q.qno}. ${q.hindi}\n${q.english}\n`;
  const labels = ["A", "B", "C", "D"];
  q.options.forEach((opt, i) => {
    const tick = opt.correct ? " ✓" : "";
    text += `${labels[i]}) ${opt.hi} / ${opt.en}${tick}\n`;
  });
  return text.trim();
}

function render() {
  const subject = document.getElementById('subjectFilter').value;
  const day = document.getElementById('dayFilter').value;
  const container = document.getElementById('questionsContainer');
  container.innerHTML = '';

  const filtered = questions.filter(q => {
    if (subject !== 'all' && q.subject !== subject) return false;
    if (day !== 'all' && String(q.day) !== day) return false;
    return true;
  });

  document.getElementById('stats').textContent =
    `Showing ${filtered.length} of ${questions.length} questions`;

  if (filtered.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#888;">No questions found.</p>';
    return;
  }

  filtered.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.style.borderLeftColor = subjectColors[q.subject] || '#1a5490';

    const header = document.createElement('div');
    header.className = 'q-header';
    header.innerHTML = `
      <span class="q-tag">Q${q.qno}</span>
      <span class="subject-tag" style="background:${subjectColors[q.subject]}22;color:${subjectColors[q.subject]};">
        ${subjectNames[q.subject]} • Day ${q.day}
      </span>
    `;

    const ta = document.createElement('textarea');
    ta.id = `q-${idx}`;
    ta.value = formatQuestion(q);
    ta.readOnly = true;

    const btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = '📋 Copy';
    btn.onclick = () => {
      ta.select();
      document.execCommand('copy');
      btn.textContent = '✅ Copied!';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = '📋 Copy';
        btn.classList.remove('copied');
      }, 1500);
    };

    card.appendChild(header);
    card.appendChild(ta);
    card.appendChild(btn);
    container.appendChild(card);
  });
}

function copyAll() {
  const subject = document.getElementById('subjectFilter').value;
  const day = document.getElementById('dayFilter').value;
  const filtered = questions.filter(q => {
    if (subject !== 'all' && q.subject !== subject) return false;
    if (day !== 'all' && String(q.day) !== day) return false;
    return true;
  });
  const all = filtered.map(formatQuestion).join('\n\n---\n\n');
  navigator.clipboard.writeText(all).then(() => {
    alert(`✅ ${filtered.length} questions copied to clipboard!`);
  });
}

function downloadJSON() {
  const dataStr = JSON.stringify(questions, null, 2);
  const blob = new Blob([dataStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'ssc-gd-questions.json';
  a.click();
}

function populateDays() {
  const days = [...new Set(questions.map(q => q.day))].sort((a,b)=>a-b);
  const sel = document.getElementById('dayFilter');
  days.forEach(d => {
    const opt = document.createElement('option');
    opt.value = d;
    opt.textContent = `Day ${d}`;
    sel.appendChild(opt);
  });
}

document.getElementById('subjectFilter').addEventListener('change', render);
document.getElementById('dayFilter').addEventListener('change', render);

populateDays();
render();
